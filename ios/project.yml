name: Velcrypt
options:
  bundleIdPrefix: com.velcrypt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.102.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # RevenueCat public SDK key (RevenueCat → Project settings → API keys, the App Store key starting with appl_).
    # It is meant to ship inside the app, so it is fine in the repo. With the placeholder appl_REPLACE_ME, Premium
    # runs on StoreKit alone and the built-in paywall is shown.
    REVENUECAT_API_KEY: appl_jjVDSaJZVStzeXYpWVhGwBbbbAG

targets:
  Velcrypt:
    type: application
    platform: iOS
    sources:
      - path: Velcrypt
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    info:
      path: Velcrypt/Info.plist
      properties:
        CFBundleDisplayName: Velcrypt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryAddUsageDescription: Velcrypt saves items you choose to export back to your photo library.
        NSPhotoLibraryUsageDescription: Velcrypt only uses photo access to delete originals you choose to remove after importing them.
        NSCameraUsageDescription: Photos and videos you take in Velcrypt go straight into your encrypted vault, never into your photo library.
        NSMicrophoneUsageDescription: Velcrypt records sound only when you film a video into your vault.
        NSFaceIDUsageDescription: Velcrypt uses Face ID only for vaults you turn it on for. It is off by default.
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.velcrypt.backup
            UTTypeDescription: Velcrypt Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [velcrypt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velcrypt.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  VelcryptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VelcryptTests
    dependencies:
      - target: Velcrypt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velcrypt.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Velcrypt:
    build:
      targets:
        Velcrypt: all
        VelcryptTests: [test]
    test:
      targets:
        - VelcryptTests
      gatherCoverageData: true
