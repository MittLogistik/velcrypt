name: iOS CI

on:
  push:
    paths: ["ios/**", ".github/workflows/ios-*.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-*.yml"]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Validate translations
        run: node scripts/validate-strings.mjs

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries | sort_by(.key) | reverse | .[]
             | select(.key | contains("iOS")) | .value[]
             | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Velcrypt.xcodeproj \
            -scheme Velcrypt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # Surfaces compiler errors and test failures as one annotation, readable without log access.
      - name: Summarize failures
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          ERRS=$(grep -E ' error: |: warning: .*Sendable|\*\* (BUILD|TEST) FAILED|Test Case .* failed|fatal error' "$LOG" \
            | sed "s#$GITHUB_WORKSPACE/##g" | awk '!seen[$0]++' | head -120)
          [ -z "$ERRS" ] && ERRS=$(tail -60 "$LOG")
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=xcodebuild failures::$ERRS"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
