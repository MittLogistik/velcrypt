name: iOS TestFlight

# Builds, signs (Xcode cloud-managed signing via App Store Connect API key) and uploads to TestFlight.
# Required repository secrets:
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64    The .p8 key file, base64-encoded
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Velcrypt.xcarchive" >> "$GITHUB_ENV"

      # Archive unsigned: automatic signing here would need a development profile (and a registered device).
      # The export step signs with a cloud-managed Apple Distribution certificate instead.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Velcrypt.xcodeproj \
            -scheme Velcrypt \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      # Surfaces signing/build/upload errors as one annotation, readable without log access.
      - name: Summarize failures
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          [ -f "$LOG" ] || exit 0
          ERRS=$(grep -E 'error:|error |\*\* (ARCHIVE|EXPORT) FAILED|No profiles|No signing|provisioning|certificate|Authentication|401|403' "$LOG" \
            | sed "s#$GITHUB_WORKSPACE/##g" | awk '!seen[$0]++' | head -80)
          [ -z "$ERRS" ] && ERRS=$(tail -60 "$LOG")
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=xcodebuild failures::$ERRS"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
